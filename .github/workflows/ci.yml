
name: Selic - CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validar-python:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar sintaxe Python
        run: python -m compileall -q src
